name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install ffmpeg (video tests)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q

  action:
    # Exercise action.yml the way other repositories use it.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Render a feature graphic through the action
        uses: ./
        with:
          args: graphic -t google.feature-graphic --title "Action test" -o fg.png
      - id: validate
        name: Validate it through the action
        uses: ./
        with:
          args: validate fg.png -t google.feature-graphic
      - name: Check outputs
        env:
          OK: ${{ steps.validate.outputs.ok }}
          RESULT: ${{ steps.validate.outputs.result }}
        run: |
          test "$OK" = "true"
          python3 -c "import json,sys; d=json.load(open(sys.argv[1])); assert d['ok'] and d['target'] == 'google.feature-graphic'" "$RESULT"
