[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "apppreview"
version = "0.1.0"
description = "Generate and validate store-compliant App Store and Google Play screenshots."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = ["click>=8.1", "Pillow>=10.1", "PyYAML>=6.0", "pydantic>=2.5"]
keywords = ["app store", "google play", "screenshots", "cli", "fastlane"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
apppreview = "apppreview.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/apppreview"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
