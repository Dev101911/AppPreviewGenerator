[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "app-preview"
dynamic = ["version"]
description = "Generate and validate store-compliant App Store and Google Play screenshots, graphics and app preview videos."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = ["click>=8.1", "Pillow>=10.1", "PyYAML>=6.0", "pydantic>=2.5"]
keywords = ["app store", "google play", "screenshots", "app preview", "cli", "fastlane", "mcp"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Graphics",
    "Topic :: Software Development :: Build Tools",
]

[project.urls]
Homepage = "https://github.com/Dev101911/AppPreviewGenerator"
Documentation = "https://github.com/Dev101911/AppPreviewGenerator#readme"
Issues = "https://github.com/Dev101911/AppPreviewGenerator/issues"
Changelog = "https://github.com/Dev101911/AppPreviewGenerator/releases"

[project.optional-dependencies]
mcp = ["mcp>=1.2"]
dev = ["pytest>=8", "ruff>=0.6", "mcp>=1.2"]

[project.scripts]
app-preview = "apppreview.cli:main"

[tool.hatch.version]
path = "src/apppreview/__init__.py"

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "README.md", "LICENSE", "CONTRIBUTING.md", "AGENTS.md"]

[tool.hatch.build.targets.wheel]
packages = ["src/apppreview"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
